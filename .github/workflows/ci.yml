name: ci
on:
pull_request:
branches: [main]
permissions:
contents: read
id-token: write
# required for OIDC
pull-requests: write # to post the plan comment
concurrency:
group: ci-${{ github.ref }}
cancel-in-progress: true
env:
AWS_REGION: eu-west-1
TF_VERSION: 1.15.0
NODE_VERSION: 24
jobs:
  services:
    name: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/package-lock.json
      - name: Install
        working-directory: services
        run: npm ci
      - name: Typecheck, lint, test, build
        working-directory: services
        run: npm run check
      # Terraform reads these bundles at plan time, so the plan job needs them.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: lambda-bundles
          path: services/dist/
          retention-days: 1
          if-no-files-found: error
  terraform:
    name: terraform (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: services
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles
          path: services/dist/
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive infra
      - uses: terraform-linters/setup-tflint@v4
      - name: Lint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: numeraft-plan-${{ github.run_id }}
      - name: Init
        working-directory: infra/envs/${{ matrix.environment }}
        run: |
          terraform init -input=false \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=envs/${{ matrix.environment }}/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}" \
          -backend-config="encrypt=true" \
          -backend-config="use_lockfile=true"
      - name: Validate
        working-directory: infra/envs/${{ matrix.environment }}
        run: terraform validate -no-color
      - name: Plan
        id: plan
        working-directory: infra/envs/${{ matrix.environment }}
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          mkdir -p .build
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m \
          -var-file=ci.tfvars -out=tfplan > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          tail -c 55000 plan.txt > plan.trimmed.txt
          cat plan.trimmed.txt
      - name: Comment the plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            const planText = fs.readFileSync(
              `infra/envs/${env}/plan.trimmed.txt`, 'utf8');
            const passed = '${{ steps.plan.outputs.exitcode }}' === '0';
            const body = [
              `### Terraform plan (${env}) ${passed ? 'succeeded' : 'FAILED'}`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              planText,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
      - name: Fail if the plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1