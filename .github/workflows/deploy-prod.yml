name: deploy-prod
on:
workflow_dispatch:
inputs:
confirm:
description: 'Type "deploy prod" to proceed'
required: true
type: string
permissions:
contents: read
id-token: write
concurrency:
group: deploy-prod
cancel-in-progress: false
env:
AWS_REGION: eu-west-1
TF_VERSION: 1.15.0
NODE_VERSION: 24
jobs:
deploy:
if: inputs.confirm == 'deploy prod'
runs-on: ubuntu-latest
# Add yourself as a required reviewer on this Environment in GitHub
# settings, plus a five minute wait timer. That is the approval gate.
environment: prod
steps:- uses: actions/checkout@v4- uses: actions/setup-node@v4
with:
node-version: ${{ env.NODE_VERSION }}
cache: npm
cache-dependency-path: services/package-lock.json- name: Build
working-directory: services
run: npm ci && npm run check- uses: hashicorp/setup-terraform@v3
with:
terraform_version: ${{ env.TF_VERSION }}- uses: aws-actions/configure-aws-credentials@v4
with:
role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
aws-region: ${{ env.AWS_REGION }}
role-session-name: numeraft-apply-prod-${{ github.run_id }}- name: Init
working-directory: infra/envs/prod
run: |
terraform init -input=false \-backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \-backend-config="key=envs/prod/terraform.tfstate" \-backend-config="region=${{ env.AWS_REGION }}" \-backend-config="encrypt=true" \-backend-config="use_lockfile=true"- name: Plan
working-directory: infra/envs/prod
env:
TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
run: |
mkdir -p .build
terraform plan -input=false -lock-timeout=5m \-var-file=ci.tfvars -out=tfplan- name: Apply
working-directory: infra/envs/prod
run: terraform apply -input=false -auto-approve tfplan- name: Smoke test
run: ./scripts/smoke.sh prod