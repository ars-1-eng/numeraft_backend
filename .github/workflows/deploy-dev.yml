name: deploy-dev
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Serialise deploys. Two applies at once is how state gets corrupted, and
# cancel-in-progress: false means a queued deploy waits rather than dying
# halfway through an apply.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_VERSION: 1.15.0
  NODE_VERSION: 24

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev # this is what makes the OIDC subject match
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/package-lock.json

      - name: Build
        working-directory: services
        run: npm ci && npm run check

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: numeraft-apply-dev-${{ github.run_id }}

      - name: Init
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # Plan to a file, then apply that exact file. Never `apply -auto-approve`
      # without a saved plan: a second plan can differ from the reviewed one.
      - name: Plan
        working-directory: infra/envs/dev
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          mkdir -p .build
          terraform plan -input=false -lock-timeout=5m \
            -var-file=ci.tfvars -out=tfplan

      - name: Apply
        working-directory: infra/envs/dev
        run: terraform apply -input=false -auto-approve tfplan

      - name: Smoke test
        run: ./scripts/smoke.sh dev